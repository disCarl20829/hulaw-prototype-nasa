# Render's free plan stops the backend after about 15 minutes without
# traffic, which also throws away its cache. This pings it so it stays awake.
# GitHub may delay scheduled runs and pauses them after 60 days without a
# commit, so an external monitor (UptimeRobot, cron-job.org) is a sturdier
# alternative. Delete this file if the backend moves to a paid plan.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://hulaw-prototype-nasa.onrender.com/api/health
